Name = "Enum"
Description = ''''''
URL = "https://enum.co"
Code = "enumco"
Since = "v5.6.0"

Example = '''
ENUMCO_API_TOKEN="xxx" \
lego run --dns enumco -d '*.example.com' -d example.com

# or

ENUMCO_CREDENTIALS="example.com:xxx,example.org:yyy" \
lego run --dns enumco -d '*.example.com' -d example.com
'''

[Configuration]
  [Configuration.Credentials]
    ENUMCO_API_TOKEN = "API token."
    ENUMCO_CREDENTIALS = "Overides API token. Mapping of zone name and API token."
[Configuration.Additional]
    ENUMCO_POLLING_INTERVAL = "Time between DNS propagation check in seconds (Default: 2)"
    ENUMCO_PROPAGATION_TIMEOUT = "Maximum waiting time for DNS propagation in seconds (Default: 60)"
    ENUMCO_TTL = "The TTL of the TXT record used for the DNS challenge in seconds (Default: 120)"
    ENUMCO_HTTP_TIMEOUT = "API request timeout in seconds (Default: 30)"

[Links]
  API = "https://docs.enum.co/api/"
  GoClient = "https://github.com/enumco/client-go"
